name: synthetic checks

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -v
      - run: python -m geo_reference.cli demo --output data/output/ci-demo.db
      - run: python -m geo_reference.cli validate --database data/output/ci-demo.db
      - run: python -m geo_reference.cli sql-checks --database data/output/ci-demo.db

