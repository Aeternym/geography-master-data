[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "geography-master-data"
version = "0.1.0"
description = "Portfolio implementation for importing and validating a geographic master-data workbook"
requires-python = ">=3.11"
dependencies = ["openpyxl==3.1.5"]

[project.scripts]
geo-reference = "geo_reference.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

